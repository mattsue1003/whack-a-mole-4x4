<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>歡樂草原！4x4 打地鼠大冒險</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: 圓潤活潑字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">

    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            font-family: 'Zen Maru Gothic', 'Fredoka One', cursive, sans-serif;
            background: linear-gradient(180deg, #7ad8ff 0%, #bcf279 55%, #66b532 100%);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* 活潑雲朵飄動動畫 */
        @keyframes cloudFloat {
            0% { transform: translateX(-150px); }
            100% { transform: translateX(calc(100vw + 150px)); }
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 9999px;
            filter: drop-shadow(0 8px 6px rgba(0,0,0,0.06));
            z-index: 1;
            pointer-events: none;
        }

        .cloud-1 {
            width: 130px; height: 45px; top: 25px;
            animation: cloudFloat 28s linear infinite;
        }
        .cloud-2 {
            width: 90px; height: 32px; top: 80px;
            animation: cloudFloat 38s linear infinite 10s;
        }

        /* 自訂木槌游標 (電腦端) */
        @media (hover: hover) and (pointer: fine) {
            .game-field {
                cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48"><g transform="rotate(25 24 24)"><rect x="21" y="16" width="6" height="28" rx="3" fill="%23b45309" stroke="%2378350f" stroke-width="2"/><rect x="8" y="6" width="32" height="15" rx="5" fill="%23ef4444" stroke="%23991b1b" stroke-width="2.5"/><rect x="11" y="9" width="6" height="9" rx="2" fill="%23fca5a5"/></g></svg>') 12 12, auto;
            }
        }

        /* 洞穴與遮罩結構 */
        .hole-wrapper {
            position: relative;
            width: 100%;
            padding-top: 100%; /* 1:1 正方形比例 */
        }

        .hole-container {
            position: absolute;
            inset: 0;
            overflow: hidden;
            border-radius: 50% / 35%;
        }

        /* 泥土洞穴邊緣立體感 */
        .dirt-mound {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(ellipse at 50% 65%, #3e2211 0%, #683b17 50%, #9a5b23 85%);
            box-shadow: inset 0 10px 14px rgba(0, 0, 0, 0.7), 0 8px 12px rgba(35, 78, 15, 0.35);
            border: 4px solid #4a270d;
        }

        /* 地鼠本體與彈出動畫 */
        .mole-actor {
            position: absolute;
            left: 50%;
            bottom: -110%;
            transform: translateX(-50%);
            width: 86%;
            height: 95%;
            transition: bottom 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            z-index: 5;
        }

        .mole-actor.up {
            bottom: -5%;
            pointer-events: auto;
            cursor: pointer;
        }

        .mole-actor.hit {
            transition: transform 0.12s ease-out;
            transform: translateX(-50%) scale(0.85) rotate(-8deg);
        }

        /* 敲擊跳出金幣或數字動效 */
        @keyframes floatUpFade {
            0% { opacity: 0; transform: translateY(0) scale(0.6); }
            30% { opacity: 1; transform: translateY(-25px) scale(1.3); }
            100% { opacity: 0; transform: translateY(-55px) scale(1); }
        }

        .floating-score {
            position: absolute;
            animation: floatUpFade 0.8s ease-out forwards;
            font-weight: 900;
            pointer-events: none;
            z-index: 30;
            text-shadow: 0 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }

        /* 敲擊槌子撞擊動效 */
        @keyframes hammerSmash {
            0% { transform: scale(1.3) rotate(-25deg); opacity: 1; }
            45% { transform: scale(0.9) rotate(20deg); opacity: 1; }
            100% { transform: scale(0.7) rotate(0deg); opacity: 0; }
        }

        .hammer-fx {
            position: absolute;
            width: 75px;
            height: 75px;
            pointer-events: none;
            z-index: 40;
            transform-origin: bottom right;
            animation: hammerSmash 0.28s ease-out forwards;
        }

        /* 星星四散特效 */
        @keyframes starBurst {
            0% { transform: translate(0, 0) scale(0.2) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1.2) rotate(200deg); opacity: 0; }
        }

        .star-particle {
            position: absolute;
            width: 20px;
            height: 20px;
            pointer-events: none;
            z-index: 35;
            animation: starBurst 0.5s ease-out forwards;
        }

        /* 草叢裝飾 */
        .grass-tuft {
            position: absolute;
            bottom: -6px;
            width: 100%;
            height: 26px;
            background-repeat: repeat-x;
            pointer-events: none;
            z-index: 8;
        }

        /* 3D 按鈕立體效果 */
        .btn-3d {
            transition: all 0.1s ease;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.25);
        }
        .btn-3d:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-start p-2 sm:p-4 min-h-screen text-slate-800">

    <!-- 背景動態白雲 -->
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>

    <!-- 主遊戲容器 -->
    <div class="w-full max-w-xl mx-auto flex flex-col items-center z-10">

        <!-- 標題與音效控制列 -->
        <header class="w-full flex justify-between items-center mb-2 px-2">
            <div class="flex items-center gap-2">
                <span class="text-3xl sm:text-4xl filter drop-shadow">🐾</span>
                <h1 class="text-2xl sm:text-3xl font-black text-amber-900 tracking-wider drop-shadow-md">
                    歡樂 4×4 打地鼠
                </h1>
            </div>
            
            <button id="soundToggleBtn" class="bg-amber-100 hover:bg-amber-200 border-2 border-amber-800 text-amber-900 px-3 py-1.5 rounded-full text-sm font-bold flex items-center gap-1.5 shadow transition">
                <span id="soundIcon" class="text-base">🔊</span>
                <span id="soundText" class="hidden sm:inline">音效開</span>
            </button>
        </header>

        <!-- 設定儀表板 (時間、難度) -->
        <div class="w-full bg-white/85 backdrop-blur-md rounded-2xl p-3 sm:p-4 shadow-lg border-2 border-green-600/30 mb-3">
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs sm:text-sm font-bold">
                <!-- 時間選單 -->
                <div class="flex flex-col">
                    <label class="text-slate-600 mb-1 flex items-center gap-1">⏱️ 遊戲時間</label>
                    <select id="timeSelect" class="bg-emerald-50 border-2 border-emerald-400 rounded-xl p-1.5 text-emerald-900 font-extrabold focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        <option value="60">60 秒 (標準)</option>
                        <option value="90">90 秒 (暢快)</option>
                        <option value="120">120 秒 (馬拉松)</option>
                    </select>
                </div>

                <!-- 難易度選擇 -->
                <div class="flex flex-col">
                    <label class="text-slate-600 mb-1 flex items-center gap-1">⚡ 挑戰難度</label>
                    <select id="diffSelect" class="bg-amber-50 border-2 border-amber-400 rounded-xl p-1.5 text-amber-900 font-extrabold focus:outline-none focus:ring-2 focus:ring-amber-500">
                        <option value="easy">輕鬆模式 (慢速)</option>
                        <option value="normal" selected>普通模式 (標準)</option>
                        <option value="hard">狂暴地獄 (極速+炸彈)</option>
                    </select>
                </div>

                <!-- 歷史最高紀錄 -->
                <div class="flex flex-col justify-center items-center bg-orange-100/80 rounded-xl p-1.5 border border-orange-300">
                    <span class="text-orange-700 text-[11px] font-semibold">🏆 歷史最高分</span>
                    <span id="bestScoreText" class="text-base sm:text-lg font-black text-orange-900">0</span>
                </div>

                <!-- 命中率 -->
                <div class="flex flex-col justify-center items-center bg-sky-100/80 rounded-xl p-1.5 border border-sky-300">
                    <span class="text-sky-700 text-[11px] font-semibold">🎯 揮擊命中率</span>
                    <span id="accuracyText" class="text-base sm:text-lg font-black text-sky-900">100%</span>
                </div>
            </div>
        </div>

        <!-- 即時狀態看板 (分數、倒數、連擊) -->
        <div class="w-full flex items-center justify-between gap-2 mb-3">
            <!-- 當前分數 -->
            <div class="flex-1 bg-gradient-to-r from-amber-400 to-yellow-300 rounded-2xl py-2 px-3 text-center border-b-4 border-amber-600 shadow-md">
                <div class="text-[11px] font-black text-amber-900 uppercase tracking-wider">SCORE 分數</div>
                <div id="currentScore" class="text-2xl sm:text-3xl font-black text-amber-950">0</div>
            </div>

            <!-- 倒數時間 -->
            <div class="flex-1 bg-gradient-to-r from-rose-500 to-pink-500 rounded-2xl py-2 px-3 text-center border-b-4 border-rose-700 shadow-md text-white">
                <div class="text-[11px] font-black text-rose-100 uppercase tracking-wider">TIME 剩餘</div>
                <div id="timeLeftDisplay" class="text-2xl sm:text-3xl font-black tracking-tight">60s</div>
            </div>

            <!-- 連擊 Combo -->
            <div class="flex-1 bg-gradient-to-r from-purple-500 to-indigo-500 rounded-2xl py-2 px-3 text-center border-b-4 border-purple-800 shadow-md text-white">
                <div class="text-[11px] font-black text-purple-200 uppercase tracking-wider">COMBO 連擊</div>
                <div id="comboDisplay" class="text-2xl sm:text-3xl font-black text-yellow-300 animate-pulse">0</div>
            </div>
        </div>

        <!-- 4x4 遊戲地圖主網格 -->
        <div class="w-full bg-gradient-to-b from-[#5fb628] to-[#448b17] p-3 sm:p-4 rounded-3xl shadow-2xl border-4 border-[#336811] relative game-field">
            <!-- 草地裝飾小花小草 -->
            <div class="absolute top-2 left-4 text-xs select-none opacity-80">🌼</div>
            <div class="absolute top-2 right-4 text-xs select-none opacity-80">🌸</div>
            <div class="absolute bottom-2 left-6 text-xs select-none opacity-80">🍀</div>
            <div class="absolute bottom-2 right-6 text-xs select-none opacity-80">🌼</div>

            <!-- 16個洞 (4x4) -->
            <div id="gridBoard" class="grid grid-cols-4 gap-2 sm:gap-3.5 relative z-10">
                <!-- Javascript 動態生成 16 個洞穴 -->
            </div>
        </div>

        <!-- 下方控制按鈕區 -->
        <div class="w-full flex items-center justify-center gap-3 mt-4">
            <button id="startBtn" class="btn-3d flex-1 py-3 px-6 bg-gradient-to-b from-green-400 to-green-600 text-white rounded-2xl font-black text-lg sm:text-xl border-b-4 border-green-800 tracking-wider flex items-center justify-center gap-2">
                <span>▶️</span> 開始遊戲
            </button>
            <button id="pauseBtn" disabled class="btn-3d py-3 px-5 bg-gradient-to-b from-amber-400 to-amber-600 text-white rounded-2xl font-black text-lg border-b-4 border-amber-800 disabled:opacity-40 disabled:cursor-not-allowed">
                ⏸️ 暫停
            </button>
            <button id="resetBtn" class="btn-3d py-3 px-5 bg-gradient-to-b from-slate-400 to-slate-600 text-white rounded-2xl font-black text-lg border-b-4 border-slate-800">
                🔄 重置
            </button>
        </div>

        <!-- 角色介紹小提示 -->
        <div class="w-full mt-4 flex items-center justify-around bg-black/20 backdrop-blur-sm rounded-xl py-2 px-3 text-xs font-bold text-white shadow-inner">
            <span class="flex items-center gap-1">🐹 普通 (+100)</span>
            <span class="flex items-center gap-1">👑 金鼠 (+300)</span>
            <span class="flex items-center gap-1">💣 炸彈 (-200 / 斷Combo)</span>
        </div>
    </div>

    <!-- 結算彈窗 Modal -->
    <div id="resultModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-gradient-to-b from-amber-50 to-orange-100 rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center border-4 border-amber-500 shadow-2xl transform transition-all scale-95">
            <div id="modalEmoji" class="text-5xl sm:text-6xl mb-2 animate-bounce">🎉</div>
            <h2 id="modalTitle" class="text-2xl sm:text-3xl font-black text-amber-950 mb-1">時間到！遊戲結束</h2>
            <p id="modalSub" class="text-sm text-amber-800 mb-4">做得好！看看你的戰果：</p>

            <div class="bg-white/80 rounded-2xl p-4 mb-5 border-2 border-amber-300 space-y-2 text-sm font-bold text-slate-700">
                <div class="flex justify-between border-b pb-1.5">
                    <span>最終得分：</span>
                    <span id="finalScore" class="text-xl font-black text-amber-600">0</span>
                </div>
                <div class="flex justify-between border-b pb-1.5">
                    <span>最高連擊 (Max Combo)：</span>
                    <span id="finalMaxCombo" class="text-indigo-600 font-extrabold">0 連擊</span>
                </div>
                <div class="flex justify-between border-b pb-1.5">
                    <span>揮擊總次數 / 命中：</span>
                    <span id="finalHitsInfo" class="text-slate-800">0 / 0</span>
                </div>
                <div class="flex justify-between">
                    <span>揮擊命中率：</span>
                    <span id="finalAccuracy" class="text-emerald-600 font-extrabold">0%</span>
                </div>
            </div>

            <button id="modalPlayAgainBtn" class="btn-3d w-full py-3 bg-gradient-to-b from-green-500 to-green-600 text-white rounded-2xl font-black text-lg border-b-4 border-green-800 tracking-wider">
                再玩一次 🚀
            </button>
        </div>
    </div>

    <!-- 簡易消息 Toast -->
    <div id="toast" class="fixed top-5 bg-amber-900 text-white font-bold px-4 py-2 rounded-full shadow-lg transition-all duration-300 opacity-0 pointer-events-none transform -translate-y-4 z-50 text-sm">
        提示訊息
    </div>

    <!-- 程式邏輯主腳本 -->
    <script>
        /* ==============================================================
           1. Web Audio API 音效合成引擎 (免加載外源聲音檔)
           ============================================================== */
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            // 地鼠冒出聲 (軟萌 Pop 泡泡聲)
            playPop() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(750, now + 0.08);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.08);
            }

            // 成功敲擊普通地鼠 (清脆打擊 + 得分高音)
            playHit() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                
                // 1. 打擊低頻震盪 (咚)
                const oscPunch = this.ctx.createOscillator();
                const gainPunch = this.ctx.createGain();
                oscPunch.type = 'triangle';
                oscPunch.frequency.setValueAtTime(260, now);
                oscPunch.frequency.exponentialRampToValueAtTime(60, now + 0.12);

                gainPunch.gain.setValueAtTime(0.4, now);
                gainPunch.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

                oscPunch.connect(gainPunch);
                gainPunch.connect(this.ctx.destination);
                oscPunch.start(now);
                oscPunch.stop(now + 0.12);

                // 2. 得分清脆音 (叮)
                const oscDing = this.ctx.createOscillator();
                const gainDing = this.ctx.createGain();
                oscDing.type = 'sine';
                oscDing.frequency.setValueAtTime(880, now + 0.02);
                oscDing.frequency.exponentialRampToValueAtTime(1320, now + 0.18);

                gainDing.gain.setValueAtTime(0.25, now + 0.02);
                gainDing.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

                oscDing.connect(gainDing);
                gainDing.connect(this.ctx.destination);
                oscDing.start(now + 0.02);
                oscDing.stop(now + 0.2);
            }

            // 金鼠獎勵敲擊 (雙音歡樂鈴聲)
            playGold() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const freqs = [1046.5, 1318.5, 1567.98, 2093.0]; // C6, E6, G6, C7
                
                freqs.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    const startTime = now + idx * 0.05;

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, startTime);

                    gain.gain.setValueAtTime(0.25, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.22);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + 0.22);
                });
            }

            // 敲中炸彈 (低沉爆炸與失誤警報音)
            playBomb() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                
                // 低頻雜訊爆炸模擬
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.35);

                gain.gain.setValueAtTime(0.45, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.35);
            }

            // 揮棒落空聲 (呼的風聲感)
            playMiss() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(380, now);
                osc.frequency.exponentialRampToValueAtTime(160, now + 0.07);

                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.07);
            }

            // 遊戲通關歡呼琶音
            playWin() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const chord = [523.25, 659.25, 783.99, 1046.5]; // C E G C
                chord.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    const t = now + idx * 0.12;

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, t);

                    gain.gain.setValueAtTime(0.3, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(t);
                    osc.stop(t + 0.45);
                });
            }
        }

        const sound = new SoundEngine();

        /* ==============================================================
           2. SVG 向量角色立繪模版 (原生SVG無外部圖床，保證不破圖)
           ============================================================== */
        // 普通棕色可愛小地鼠
        const NORMAL_MOLE_SVG = `
        <svg viewBox="0 0 100 115" class="w-full h-full drop-shadow-md">
            <!-- 身體圓拱 -->
            <path d="M15 115 C15 45, 85 45, 85 115 Z" fill="#925828" stroke="#5c3413" stroke-width="4"/>
            <path d="M25 115 C25 65, 75 65, 75 115 Z" fill="#d79b65" opacity="0.6"/>
            <!-- 圓圓耳朵 -->
            <circle cx="22" cy="52" r="13" fill="#925828" stroke="#5c3413" stroke-width="3"/>
            <circle cx="22" cy="52" r="7" fill="#fca5a5"/>
            <circle cx="78" cy="52" r="13" fill="#925828" stroke="#5c3413" stroke-width="3"/>
            <circle cx="78" cy="52" r="7" fill="#fca5a5"/>
            <!-- 大眼睛 -->
            <ellipse cx="38" cy="65" rx="5.5" ry="7" fill="#1e293b"/>
            <circle cx="36" cy="63" r="2.5" fill="#ffffff"/>
            <ellipse cx="62" cy="65" rx="5.5" ry="7" fill="#1e293b"/>
            <circle cx="60" cy="63" r="2.5" fill="#ffffff"/>
            <!-- 粉紅害羞腮紅 -->
            <ellipse cx="28" cy="76" rx="6" ry="4" fill="#f87171" opacity="0.65"/>
            <ellipse cx="72" cy="76" rx="6" ry="4" fill="#f87171" opacity="0.65"/>
            <!-- 鼻子 -->
            <ellipse cx="50" cy="72" rx="7" ry="5" fill="#311706"/>
            <!-- 齙牙與嘴巴 -->

        // 戴皇冠黃金獎勵地鼠 (+300 分)
        const GOLD_MOLE_SVG = `

        // 搗蛋炸彈 (-200 分且重置 Combo)
        const BOMB_MOLE_SVG = `

        // 被敲暈的表情 (暈頭轉向螺旋眼)
        const DIZZY_MOLE_SVG = `
        <svg viewBox="0 0 100 115" class="w-full h-full drop-shadow-md">
            <path d="M15 115 C15 45, 85 45, 85 115 Z" fill="#78431b" stroke="#452309" stroke-width="4"/>

        /* ==============================================================
           3. 遊戲狀態與核心邏輯
           ============================================================== */
        const TOTAL_HOLES = 16;
        let score = 0;
        let timeLeft = 60;
        let selectedDuration = 60;
        let combo = 0;
        let maxCombo = 0;
        let totalSwings = 0;
        let totalHits = 0;

        let isPlaying = false;
        let isPaused = false;
        let timerInterval = null;
        let moleSpawnTimeout = null;

        // 難易度設定參數
        const DIFFICULTY_SETTINGS = {
            easy: {
                stayMin: 1200, stayMax: 1500,
                spawnIntervalMin: 700, spawnIntervalMax: 1100,
                maxSimultaneous: 2,
                goldChance: 0.15,
                bombChance: 0.05
            },
            normal: {
                stayMin: 800, stayMax: 1100,
                spawnIntervalMin: 500, spawnIntervalMax: 800,
                maxSimultaneous: 3,
                goldChance: 0.18,
                bombChance: 0.14
            },
            hard: {
                stayMin: 500, stayMax: 750,
                spawnIntervalMin: 350, spawnIntervalMax: 600,
                maxSimultaneous: 4,
                goldChance: 0.20,
                bombChance: 0.28
            }
        };

        // 紀錄目前每個洞的狀態
        // status: 'empty' | 'up' | 'hit'
        // type: 'normal' | 'gold' | 'bomb'
        const holesState = Array.from({ length: TOTAL_HOLES }, () => ({
            status: 'empty',
            type: 'normal',
            hideTimeout: null
        }));

        // DOM 元素引用
        const gridBoard = document.getElementById('gridBoard');
        const currentScoreEl = document.getElementById('currentScore');
        const timeLeftDisplay = document.getElementById('timeLeftDisplay');
        const comboDisplay = document.getElementById('comboDisplay');
        const accuracyText = document.getElementById('accuracyText');
        const bestScoreText = document.getElementById('bestScoreText');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const timeSelect = document.getElementById('timeSelect');
        const diffSelect = document.getElementById('diffSelect');
        const soundToggleBtn = document.getElementById('soundToggleBtn');
        const soundIcon = document.getElementById('soundIcon');
        const soundText = document.getElementById('soundText');
        const resultModal = document.getElementById('resultModal');
        const modalPlayAgainBtn = document.getElementById('modalPlayAgainBtn');
        const toast = document.getElementById('toast');

        /* ==============================================================
           4. 棋盤初始化與事件綁定
           ============================================================== */
        function initBoard() {
            gridBoard.innerHTML = '';
            for (let i = 0; i < TOTAL_HOLES; i++) {
                const holeWrapper = document.createElement('div');
                holeWrapper.className = 'hole-wrapper';

                // 洞穴內部容器與泥土造型
                holeWrapper.innerHTML = `
                    <div class="dirt-mound"></div>
                    <div class="hole-container">
                        <div id="mole-${i}" class="mole-actor" data-index="${i}">
                            ${NORMAL_MOLE_SVG}
                        </div>
                    </div>
                    <!-- 前景草邊邊緣 -->
                    <div class="grass-tuft flex justify-between items-end px-1">
                        <span class="text-green-700 text-xs font-black">▲</span>
                        <span class="text-green-600 text-[10px] font-black">▲</span>
                        <span class="text-green-700 text-xs font-black">▲</span>
                    </div>
                `;

                // 監聽敲擊 (支援 Mouse 與 Touch)
                const moleActor = holeWrapper.querySelector(`#mole-${i}`);
                
                // 點擊地鼠
                moleActor.addEventListener('pointerdown', (e) => {
                    e.stopPropagation(); // 避免觸發揮空
                    handleMoleHit(i, e);
                });

                // 點擊洞穴周圍 (揮空)
                holeWrapper.addEventListener('pointerdown', (e) => {
                    handleBoardSwing(e);
                });

                gridBoard.appendChild(holeWrapper);
            }

            // 讀取最高分
            updateBestScoreDisplay();
        }

        // 畫面點擊總次數累加與命中率計算
        function handleBoardSwing(e) {
            if (!isPlaying || isPaused) return;
            totalSwings++;
            updateStatsUI();
            sound.playMiss();
            showHammerEffect(e.clientX, e.clientY);
        }

        // 敲擊地鼠處理
        function handleMoleHit(index, e) {
            if (!isPlaying || isPaused) return;
            
            const hole = holesState[index];
            if (hole.status !== 'up') return; // 已縮回或已打擊過

            totalSwings++;
            totalHits++;
            hole.status = 'hit';
            clearTimeout(hole.hideTimeout);

            const moleElem = document.getElementById(`mole-${index}`);
            moleElem.classList.add('hit');

            // 槌子擊打視覺特效
            showHammerEffect(e.clientX, e.clientY);

            if (hole.type === 'bomb') {
                // 敲到炸彈！
                combo = 0;
                const penalty = 200;
                score = Math.max(0, score - penalty);
                sound.playBomb();
                showFloatingText(e.clientX, e.clientY, `-${penalty} 💣`, '#ef4444');
                createExplosionStars(e.clientX, e.clientY, '#475569');
            } else if (hole.type === 'gold') {
                // 敲中黃金地鼠！
                combo++;
                if (combo > maxCombo) maxCombo = combo;
                const comboBonus = Math.floor(combo / 5) * 50;
                const earned = 300 + comboBonus;
                score += earned;
                sound.playGold();
                showFloatingText(e.clientX, e.clientY, `+${earned} 👑`, '#eab308');
                createExplosionStars(e.clientX, e.clientY, '#facc15');
            } else {
                // 普通地鼠
                combo++;
                if (combo > maxCombo) maxCombo = combo;
                const comboBonus = Math.floor(combo / 5) * 30;
                const earned = 100 + comboBonus;
                score += earned;
                sound.playHit();
                showFloatingText(e.clientX, e.clientY, `+${earned}`, '#22c55e');
                createExplosionStars(e.clientX, e.clientY, '#fbbf24');
            }

            // 切換成敲暈狀態圖
            if (hole.type !== 'bomb') {
                moleElem.innerHTML = DIZZY_MOLE_SVG;
            }

            // 連擊提示特效
            if (combo >= 2) {
                showComboFloat(e.clientX, e.clientY, combo);
            }

            updateStatsUI();

            // 0.28秒後縮回洞中
            setTimeout(() => {
                moleElem.classList.remove('up', 'hit');
                hole.status = 'empty';
            }, 280);
        }

        /* ==============================================================
           5. 視覺回饋效果 (漂浮文字、星星、槌子)
           ============================================================== */
        // 浮動得分文字
        function showFloatingText(x, y, text, color) {
            const el = document.createElement('div');
            el.className = 'floating-score text-2xl font-black';
            el.style.left = `${x - 20}px`;
            el.style.top = `${y - 30}px`;
            el.style.color = color;
            el.textContent = text;
            document.body.appendChild(el);

            setTimeout(() => el.remove(), 850);
        }

        // 連擊提示文字
        function showComboFloat(x, y, count) {
            const el = document.createElement('div');
            el.className = 'floating-score text-sm font-black text-amber-300';
            el.style.left = `${x - 15}px`;
            el.style.top = `${y + 12}px`;
            el.textContent = `Combo ×${count}!`;
            document.body.appendChild(el);

            setTimeout(() => el.remove(), 700);
        }

        // 槌子打擊落下動效
        function showHammerEffect(x, y) {
            const hammer = document.createElement('div');
            hammer.className = 'hammer-fx';
            hammer.style.left = `${x - 30}px`;
            hammer.style.top = `${y - 50}px`;
            hammer.innerHTML = `
                <svg viewBox="0 0 60 60" class="w-full h-full drop-shadow-lg">
                    <g transform="rotate(30 30 30)">
                        <rect x="26" y="22" width="8" height="35" rx="4" fill="#92400e" stroke="#451a03" stroke-width="2"/>
                        <rect x="10" y="8" width="40" height="20" rx="6" fill="#dc2626" stroke="#7f1d1d" stroke-width="3"/>
                        <rect x="14" y="12" width="8" height="12" rx="2" fill="#fca5a5" opacity="0.8"/>
                    </g>
                </svg>
            `;
            document.body.appendChild(hammer);
            setTimeout(() => hammer.remove(), 300);
        }

        // 擊中飛散星星
        function createExplosionStars(x, y, color) {
            const count = 6;
            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'star-particle';
                star.style.left = `${x - 10}px`;
                star.style.top = `${y - 10}px`;

                const angle = (Math.PI * 2 / count) * i;
                const distance = 35 + Math.random() * 25;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;

                star.style.setProperty('--tx', `${tx}px`);
                star.style.setProperty('--ty', `${ty}px`);

                star.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="${color}">
                        <polygon points="12,2 15,9 22,9 17,14 19,21 12,17 5,21 7,14 2,9 9,9"/>
                    </svg>
                `;
                document.body.appendChild(star);
                setTimeout(() => star.remove(), 550);
            }
        }

        /* ==============================================================
           6. 地鼠出現調度機制 (Spawning Loop)
           ============================================================== */
        function spawnMole() {
            if (!isPlaying || isPaused) return;

            const diff = DIFFICULTY_SETTINGS[diffSelect.value];

            // 檢查目前已有幾隻地鼠立起
            const activeMoles = holesState.filter(h => h.status === 'up').length;

            if (activeMoles < diff.maxSimultaneous) {
                // 找出目前所有空閒的洞
                const availableIndices = [];
                holesState.forEach((h, idx) => {
                    if (h.status === 'empty') availableIndices.push(idx);
                });

                if (availableIndices.length > 0) {
                    const randomIndex = availableIndices[Math.floor(Math.random() * availableIndices.length)];
                    activateMole(randomIndex, diff);
                }
            }

            // 安排下一次隨機生成間隔
            const nextInterval = Math.random() * (diff.spawnIntervalMax - diff.spawnIntervalMin) + diff.spawnIntervalMin;
            moleSpawnTimeout = setTimeout(spawnMole, nextInterval);
        }

        function activateMole(index, diff) {
            const hole = holesState[index];
            hole.status = 'up';

            // 決定出現類型：普通、金地鼠、炸彈
            const roll = Math.random();
            let type = 'normal';
            let svgContent = NORMAL_MOLE_SVG;

            if (roll < diff.bombChance) {
                type = 'bomb';
                svgContent = BOMB_MOLE_SVG;
            } else if (roll < diff.bombChance + diff.goldChance) {
                type = 'gold';
                svgContent = GOLD_MOLE_SVG;
            }

            hole.type = type;

            const moleElem = document.getElementById(`mole-${index}`);
            moleElem.innerHTML = svgContent;
            moleElem.classList.remove('hit');
            moleElem.classList.add('up');

            // 播放出現音
            if (type !== 'bomb') {
                sound.playPop();
            }

            // 設定在洞口停留時間
            const stayTime = Math.random() * (diff.stayMax - diff.stayMin) + diff.stayMin;

            hole.hideTimeout = setTimeout(() => {
                if (hole.status === 'up') {
                    moleElem.classList.remove('up');
                    hole.status = 'empty';
                }
            }, stayTime);
        }

        /* ==============================================================
           7. 遊戲主流程控制 (開始、暫停、倒數、結算、重置)
           ============================================================== */
        function startGame() {
            sound.init(); // 觸發使用者手勢啟用 AudioContext
            
            // 重置數值
            score = 0;
            combo = 0;
            maxCombo = 0;
            totalSwings = 0;
            totalHits = 0;
            selectedDuration = parseInt(timeSelect.value, 10);
            timeLeft = selectedDuration;

            isPlaying = true;
            isPaused = false;

            // 介面按鈕狀態
            startBtn.disabled = true;
            startBtn.classList.add('opacity-50', 'cursor-not-allowed');
            pauseBtn.disabled = false;
            timeSelect.disabled = true;
            diffSelect.disabled = true;

            updateStatsUI();
            resetAllMoles();

            // 倒數計時器
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!isPaused) {
                    timeLeft--;
                    updateStatsUI();

                    if (timeLeft <= 0) {
                        endGame();
                    }
                }
            }, 1000);

            // 開始生成地鼠
            clearTimeout(moleSpawnTimeout);
            spawnMole();

            showToast("🎮 遊戲開始！全力敲擊地鼠吧！");
        }

        function togglePause() {
            if (!isPlaying) return;

            isPaused = !isPaused;
            if (isPaused) {
                pauseBtn.innerHTML = "▶️ 繼續";
                pauseBtn.classList.remove('from-amber-400', 'to-amber-600');
                pauseBtn.classList.add('from-emerald-400', 'to-emerald-600');
                showToast("⏸️ 遊戲已暫停");
            } else {
                pauseBtn.innerHTML = "⏸️ 暫停";
                pauseBtn.classList.remove('from-emerald-400', 'to-emerald-600');
                pauseBtn.classList.add('from-amber-400', 'to-amber-600');
                showToast("▶️ 遊戲繼續！");
                spawnMole();
            }
        }

        function endGame() {
            isPlaying = false;
            clearInterval(timerInterval);
            clearTimeout(moleSpawnTimeout);
            resetAllMoles();

            // 更新歷史最高紀錄
            const best = getBestScore();
            if (score > best) {
                localStorage.setItem('whack_mole_best_score', score);
                updateBestScoreDisplay();
                sound.playWin();
            }

            // 彈出結算視窗
            showResultModal();

            // 恢復控制狀態
            startBtn.disabled = false;
            startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            pauseBtn.disabled = true;
            pauseBtn.innerHTML = "⏸️ 暫停";
            timeSelect.disabled = false;
            diffSelect.disabled = false;
        }

        function resetGame() {
            isPlaying = false;
            isPaused = false;
            clearInterval(timerInterval);
            clearTimeout(moleSpawnTimeout);

            score = 0;
            combo = 0;
            maxCombo = 0;
            totalSwings = 0;
            totalHits = 0;
            selectedDuration = parseInt(timeSelect.value, 10);
            timeLeft = selectedDuration;

            startBtn.disabled = false;
            startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            pauseBtn.disabled = true;
            pauseBtn.innerHTML = "⏸️ 暫停";
            timeSelect.disabled = false;
            diffSelect.disabled = false;

            resetAllMoles();
            updateStatsUI();
            resultModal.classList.add('hidden');
            showToast("🔄 遊戲已重設");
        }

        function resetAllMoles() {
            holesState.forEach((hole, idx) => {
                clearTimeout(hole.hideTimeout);
                hole.status = 'empty';
                const el = document.getElementById(`mole-${idx}`);
                if (el) {
                    el.classList.remove('up', 'hit');
                }
            });
        }

        function updateStatsUI() {
            currentScoreEl.textContent = score;
            timeLeftDisplay.textContent = `${timeLeft}s`;
            comboDisplay.textContent = combo;

            const accuracy = totalSwings > 0 ? Math.round((totalHits / totalSwings) * 100) : 100;
            accuracyText.textContent = `${accuracy}%`;

            if (timeLeft <= 10 && isPlaying) {
                timeLeftDisplay.parentElement.classList.add('animate-pulse');
            } else {
                timeLeftDisplay.parentElement.classList.remove('animate-pulse');
            }
        }

        function getBestScore() {
            return parseInt(localStorage.getItem('whack_mole_best_score') || '0', 10);
        }

        function updateBestScoreDisplay() {
            bestScoreText.textContent = getBestScore();
        }

        function showResultModal() {
            const accuracy = totalSwings > 0 ? Math.round((totalHits / totalSwings) * 100) : 100;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalMaxCombo').textContent = `${maxCombo} 次連擊`;
            document.getElementById('finalHitsInfo').textContent = `${totalHits} / ${totalSwings}`;
            document.getElementById('finalAccuracy').textContent = `${accuracy}%`;

            const emojiEl = document.getElementById('modalEmoji');
            const titleEl = document.getElementById('modalTitle');

            if (score >= 3000) {
                emojiEl.textContent = "👑";
                titleEl.textContent = "太神啦！地鼠終結者！";
            } else if (score >= 1500) {
                emojiEl.textContent = "🎉";
                titleEl.textContent = "幹得好！反應非常敏捷！";
            } else {
                emojiEl.textContent = "🐹";
                titleEl.textContent = "再接再厲！下盤會更好！";
            }

            resultModal.classList.remove('hidden');
        }

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.remove('opacity-0', '-translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', '-translate-y-4');
            }, 2000);
        }

        /* ==============================================================
           8. 事件監聽掛載
           ============================================================== */
        startBtn.addEventListener('click', startGame);
        pauseBtn.addEventListener('click', togglePause);
        resetBtn.addEventListener('click', resetGame);
        modalPlayAgainBtn.addEventListener('click', () => {
            resultModal.classList.add('hidden');
            startGame();
        });

        // 下拉選單改動連動更新預設時間
        timeSelect.addEventListener('change', () => {
            if (!isPlaying) {
                timeLeft = parseInt(timeSelect.value, 10);
                timeLeftDisplay.textContent = `${timeLeft}s`;
            }
        });

        // 音效開關切換
        soundToggleBtn.addEventListener('click', () => {
            sound.muted = !sound.muted;
            if (sound.muted) {
                soundIcon.textContent = "🔇";
                soundText.textContent = "靜音中";
                soundToggleBtn.classList.remove('bg-amber-100', 'text-amber-900');
                soundToggleBtn.classList.add('bg-slate-300', 'text-slate-600');
            } else {
                sound.init();
                soundIcon.textContent = "🔊";
                soundText.textContent = "音效開";
                soundToggleBtn.classList.add('bg-amber-100', 'text-amber-900');
                soundToggleBtn.classList.remove('bg-slate-300', 'text-slate-600');
            }
        });

        // 初始化棋盤
        window.onload = () => {
            initBoard();
        };
    </script>
</body>
</html>
